# "Current Projects" block on the home page.
#
# One item per list row, in the order given here.
# "link" is a Zola internal path (@/...), so get_url resolves the translation
# for the active language and one entry serves all three languages.
# "content" holds the row title and teaser, which are editorial copy and are
# deliberately shorter than each page's own text.
#
# The heading ("title"), the optional intro and the items are all here, so the
# block owns everything it renders; the position on the page is set in
# templates/home.html. "intro" is one short paragraph above the list, rendered
# only when present; it is plain text, so it cannot contain Markdown links.

title:
  en: "Current Projects"
  ru: "Текущие проекты"
  hy: "Ընթացիկ նախագծեր"

intro:
  en: "These are some of the projects we are running now or planning to start soon. Everyone is welcome to join them — or to support them in other ways."
  ru: "Это некоторые из проектов, которые мы ведём сейчас или готовим к запуску в ближайшее время. Присоединиться может каждый — или поддержать их другим способом."
  hy: "Սրանք այն նախագծերից են, որոնք ընթանում են հիմա կամ շուտով կսկսվեն։ Միանալ կամ այլ կերպ աջակցել կարող է յուրաքանչյուրը։"

items:
  - link: "@/action/mapping.md"
    content:
      ru:
        title: "Карта деревьев"
        description: "Добавляйте деревья рядом с собой через наше мобильное приложение и следите за ними. Отмечайте все изменения и наблюдайте, как деревья растут: эти данные помогают нам понимать состояние зелёного фонда и планировать, где нужна помощь."
      en:
        title: "Tree Map"
        description: "Use our mobile app to add trees around you and keep an eye on them. Log every change and watch how trees grow — this data helps us understand the state of the urban canopy and plan where involvement is needed."
      hy:
        title: "Ծառերի քարտեզ"
        description: "Ավելացրեք ձեր շուրջը գտնվող ծառերը մեր բջջային հավելվածով և հետևեք նրանց։ Գրանցեք բոլոր փոփոխությունները և դիտեք, թե ինչպես են ծառերը աճում։ Այս տվյալները օգնում են մեզ հասկանալ կանաչ ֆոնդի վիճակը և պլանավորել, թե որտեղ է պետք ներգրավվածություն։"

  - link: "@/guidelines/_index.md"
    content:
      ru:
        title: "Модельная улица"
        description: "Делаем одну небольшую улицу образцовой: новые посадки, гнездовые домики и другие интересные методы — вдобавок ко всем щадящим приёмам ухода, доступным обычным жителям. Первый этап уже идёт в Арабкире."
      en:
        title: "Model street"
        description: "We are making one small street exemplary with new plantings, nesting boxes and other interesting methods, on top of every non-destructive care technique available to ordinary residents. The first sprint is under way in Arabkir."
      hy:
        title: "Օրինակելի փողոց"
        description: "Մեկ փոքր փողոց դարձնում ենք օրինակելի՝ նոր տնկարկներ, բնադրատուփեր և այլ հետաքրքիր մեթոդներ, ի լրումն սովորական բնակիչներին հասանելի խնամքի բոլոր ոչ կործանարար մեթոդների։ Առաջին փուլն ընթացքի մեջ է Արաբկիրում։"

  - link: "@/action/replant/index.md"
    content:
      ru:
        title: "Сервис для приствольных лунок"
        description: "Изучаем варианты мульчирования и сочетания растений, исходя из того, что реально доступно на месте, а затем популяризируем найденные решения в брошюре."
      en:
        title: "Tree Pit Service"
        description: "We are looking at mulching options and plant combinations that fit what is actually available locally, and will then popularise the solutions in a brochure."
      hy:
        title: "Ծառափոսերի ծառայություն"
        description: "Ուսումնասիրում ենք ցանքածածկման տարբերակներ և բույսերի զուգակցումներ՝ հաշվի առնելով, թե ինչ է իրականում հասանելի տեղում, ապա բրոշյուրի միջոցով տարածում ենք գտնված լուծումները։"

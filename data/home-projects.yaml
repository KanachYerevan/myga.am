# "Current Projects" block on the home page.
#
# One item per list row, in the order given here.
# "link" is a Zola internal path (@/...), so get_url resolves the translation
# for the active language and one entry serves all three languages.
# "content" holds the row title and teaser, which are editorial copy and are
# deliberately shorter than each page's own text.
#
# The heading ("title"), the optional intro and the items are all here, so the
# block owns everything it renders; the position on the page is set in
# templates/home.html. "intro" is one short paragraph above the list, rendered
# only when present; it is plain text, so it cannot contain Markdown links.
#
# Icons: "default_icon" is the icon of every row. A row replaces it by setting
# its own "icon" with the full <svg> markup, the same convention as
# data/home-involved.yaml. The icon is decorative, so only the title names the
# link; keep the svg at 20x20 and stroke="currentColor" to match the row grid.

title:
  en: "Current Projects"
  ru: "Наши проекты"
  hy: "Ընթացիկ նախագծեր"

intro:
  en: "Here are some of the projects we are working on right now or launching soon. Everyone is welcome to join our team or support our work in other ways."
  ru: "Вот проекты, над которыми мы работаем прямо сейчас или которые запустим в ближайшее время. Вы можете присоединиться к нашей команде или поддержать нас любым удобным способом."
  hy: "Ահա այն նախագծերը, որոնց վրա աշխատում ենք հենց հիմա կամ պատրաստվում ենք սկսել առաջիկայում։ Յուրաքանչյուր ոք կարող է միանալ մեզ կամ աջակցել որևէ այլ կերպ։"

# Document icon, the same one the legal list on /guidelines/ uses.
default_icon: >-
  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path><polyline points="14 2 14 8 20 8"></polyline><line x1="16" y1="13" x2="8" y2="13"></line><line x1="16" y1="17" x2="8" y2="17"></line><polyline points="10 9 9 9 8 9"></polyline></svg>

items:
  # To give one row its own icon, add it above "content", for example:
  #
  #   - link: "@/action/mapping.md"
  #     icon: >-
  #       <svg width="20" height="20" viewBox="0 0 24 24" ...></svg>
  #     content:
  #
  - link: "@/action/mapping.md"
    content:
      ru:
        title: "Карта деревьев"
        description: "Наносите деревья своего района на карту через наше приложение и следите за их состоянием. Фиксируйте любые изменения: эти данные помогают нам оценивать здоровье зелёного фонда Еревана и вовремя приходить на помощь."
      en:
        title: "Tree Map"
        description: "Use our mobile app to map trees in your neighborhood and keep track of them. By logging changes, you help us monitor the health of Yerevan's urban canopy and direct care where it is needed most."
      hy:
        title: "Ծառերի քարտեզ"
        description: "Գրանցեք ձեր թաղամասի ծառերը մեր բջջային հավելվածով և հետևեք դրանց վիճակին։ Նշեք ցանկացած փոփոխություն. այս տվյալներն օգնում են մեզ գնահատել Երևանի կանաչ ֆոնդի առողջությունն ու տեսնել, թե որտեղ է օգնությունն առավել անհրաժեշտ։"
    icon: >-
      <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">

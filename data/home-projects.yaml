  - link: "@/guidelines/_index.md"
    content:
      ru:
        title: "Модельная улица"
        description: "Превращаем одну из небольших улиц в образец для всего города: высаживаем новые растения, вешаем домики для птиц и показываем бережные приёмы ухода, доступные каждому жителю. Первые работы уже идут в Арабкире."
      en:
        title: "Model Street"
        description: "We are turning a quiet neighborhood street into a green model for the whole city: planting new greenery, installing bird nesting boxes, and showcasing gentle care techniques any resident can practice. Work on the first pilot is already under way in Arabkir."
      hy:
        title: "Օրինակելի փողոց"
        description: "Երևանի փոքր փողոցներից մեկը վերածում ենք օրինակելիի՝ նոր տնկիներով, բնադրատուփերով և ծառերի խնամքի այնպիսի հոգատար միջոցներով, որոնք հասանելի են յուրաքանչյուր բնակչի։ Առաջին աշխատանքներն արդեն ընթանում են Արաբկիրում։"

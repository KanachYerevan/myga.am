# "Get Involved" block on the home page.
#
# One item per list row, in the order given here.
# "link" is a Zola internal path (@/...), so get_url resolves the translation
# for the active language and one entry serves all three languages.
# "content" holds the row title and teaser, which are editorial copy and are
# deliberately shorter than each page's own text.
#
# The heading ("title") and the items are both here, so the block owns
# everything it renders; the position on the page is set in templates/home.html.

title:
  en: "Get Involved"
  ru: "Как вы можете помочь"
  hy: "Ինչպես մասնակցել"

items:
  - link: "@/action/report/index.md"
    content:
      ru:
        title: "Сообщите о проблеме"
        description: "Деревья не могут позвать на помощь сами. Если вы заметили сломанный ствол, варварскую обрезку или сомнительные работы — дайте нам знать: защитить городские деревья можем только мы с вами."
      en:
        title: "Report a problem"
        description: "Trees cannot speak or ask for help. If you spot a broken trunk, aggressive pruning, or suspicious felling, let us know — urban trees rely on residents to protect them."
      hy:
        title: "Հայտնեք խնդրի մասին"
        description: "Ծառերն ինքնուրույն չեն կարող օգնություն կանչել։ Եթե նկատել եք կոտրված բուն, անհասկանալի էտ կամ կասկածելի աշխատանքներ, տեղեկացրեք մեզ. քաղաքի ծառերին պաշտպանել կարող ենք միայն մենք։"

  - link: "@/action/replant/index.md"
    content:
      ru:
        title: "Посадите дерево или цветник"
        description: "Озеленить свой двор или улицу под силу каждому — от небольшого цветника до полноценного дерева. Мы подскажем, как сделать всё правильно: какие породы выбрать, где найти здоровый саженец, как его посадить и выходить."
      en:
        title: "Plant a tree or garden"
        description: "Anyone can help green their street or courtyard, from a small flowerbed to a full-grown shade tree. We guide you through choosing suitable species, picking healthy saplings, planting, and early care."
      hy:
        title: "Տնկեք ծառ կամ ծաղիկներ"
        description: "Յուրաքանչյուր ոք կարող է կանաչապատել իր շրջապատը՝ փոքր ծաղկանոցից մինչև ստվարաստվեր ծառ։ Մենք կհուշենք, թե ինչպես դա ճիշտ անել՝ որ տեսակներն ընտրել, ինչպիսի տնկի գնել, ինչպես տնկել և խնամել։"

  - link: "@/journal/2025-11-16-acorns/index.md"
    content:
      ru:
        title: "Озелените пустырь"
        description: "Как собрать семена местных деревьев и посеять их на склонах и пустырях вдали от шумных улиц. Мы проверили «беличий метод» на желудях и делимся подробной инструкцией."
      en:
        title: "Grow trees from seed"
        description: "How to collect native seeds and sow them on hillsides and vacant land away from busy streets. We tested the 'squirrel method' with acorns — here is everything you need to know."
      hy:
        title: "Ծառեր աճեցրեք սերմերից"
        description: "Ինչպես հավաքել տեղական ծառերի սերմերն ու ցանել դրանք լանջերին և ամայի տարածքներում։ Մենք կաղիններով փորձարկել ենք «սկյուռի մեթոդը» և կիսվում ենք մանրամասն ուղեցույցով։"

  - link: "@/guidelines/biodiversity/great-tit.md"
    content:
      ru:
        title: "Повесьте домик для птиц"
        description: "Домик помогает городским птицам безопасно вывести птенцов, а они взамен защищают деревья от вредителей. Рассказываем, где повесить синичник, как закрепить его без вреда для ствола и как сделать домик своими руками."
      en:
        title: "Put up a bird box"
        description: "A nest box gives urban birds a safe place to raise their chicks, and in return they protect trees from pests. Here is where to hang it, how to attach it safely to a trunk, and how to build one yourself."
      hy:
        title: "Տեղադրեք թռչնաբույն"
        description: "Բնադրատուփն օգնում է քաղաքային թռչուններին ապահով ձագեր մեծացնել, իսկ նրանք պաշտպանում են ծառերը վնասատուներից։ Որտեղ տեղադրել այն, ինչպես ամրացնել՝ առանց բունը վնասելու, և ինչպես պատրաստել սեփական ձեռքերով։"

  - link: "@/status/birds/index.md"
    content:
      ru:
        title: "Повесьте домик для летучих мышей"
        description: "Домик на дереве или стене даёт рукокрылым надёжное убежище, а небольшая колония летучих мышей за ночь уничтожает тысячи комаров и вредных насекомых."
      en:
        title: "Install a bat box"
        description: "A shelter on a tree or sunny wall provides safe roosting for bats, whose colonies naturally devour thousands of mosquitoes and garden pests each night."
      hy:
        title: "Տեղադրեք չղջիկների տուփ"
        description: "Ծառի կամ պատի վրա ամրացված տուփը չղջիկներին հուսալի ապաստան է տալիս, իսկ նրանց գաղութը գիշերը ոչնչացնում է հազարավոր մոծակներ և վնասատու միջատներ։"

  - link: "@/about/directory.md"
    content:
      ru:
        title: "Где стать волонтёром"
        description: "Список инициатив и сообществ Еревана, которые высаживают деревья, проводят субботники и всегда рады волонтёрам."
      en:
        title: "Where to volunteer"
        description: "A directory of local groups and grassroots initiatives in Yerevan that run tree plantings and clean-ups — and are always happy to welcome volunteers."
      hy:
        title: "Որտեղ կամավորագրվել"
        description: "Երևանի այն նախաձեռնություններն ու խմբերը, որոնք ծառատունկեր և շաբաթօրյակներ են կազմակերպում ու միշտ ուրախ են նոր կամավորների։"

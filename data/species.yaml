# Species of Yerevan, Armenia.
# Sources: iNaturalist observations (place "Erevan", place_id 10430), retrieved 2026-11-12,
# and the curated selection previously maintained on /guidelines/species/.
# Woody taxa only. OPALS is the Ogren Plant Allergy Scale (1 = least allergenic, 10 = most allergenic).
# opals_basis records whether a score is for the species itself or for its genus.
# It is internal and is not rendered on the page.
# Group is a display bucket, not a taxonomic rank: tree and conifer render on the trees
# table, shrub on the shrubs table, vine on the climbers table. Shrub covers prostrate
# and multi-stemmed woody plants at any height, including the low junipers.
# Height and width are the average dimensions of a mature specimen, in metres.
# Zone is the coldest USDA hardiness zone in which the species is normally hardy outdoors.
# Water is the WUCOLS IV water-use class: vl (very low), l (low), m (moderate), h (high).
# It describes the irrigation a species needs once established. Classes follow WUCOLS IV
# where the taxon is listed there, and native habitat or regional floras otherwise.
# Light is the shadiest exposure in which a species persists: s (full sun only), sp (sun or
# part shade), p (part shade), f (full shade). It is a floor rather than an optimum and is
# read against the canopy a site will carry in twenty years. Classes follow Ellenberg light
# values for European taxa, Silvics of North America for North American taxa, and native
# habitat or regional floras otherwise.
# Shelter marks a species that scorches in full summer sun and needs dappling or afternoon
# shade in Yerevan.
# Evergreen is set on the species that hold their foliage through a cold winter; an entry
# without the key is deciduous. Semi-evergreens that a Yerevan winter strips are unmarked.


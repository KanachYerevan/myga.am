# "Problems" block on the home page.
#
# One item per list row, in the order given here.
# "link" is a Zola internal path (@/...), so get_url resolves the translation
# for the active language and one entry serves all three languages.
# "content" holds the row title and teaser, which are editorial copy and are
# deliberately shorter than each page's own text.
#
# The heading lives in config.toml ([translations] home_problems); the position
# on the page is set in templates/home.html.

- link: "@/status/topping/index.md"
  content:
    ru:
      title: "Топпинг и варварская обрезка"
      description: "Деревья по всему городу по-прежнему превращают в пни. Мы добиваемся официального запрета и перехода к структурной обрезке силами обученных арбористов."
    en:
      title: "Topping and destructive pruning"
      description: "Trees across the city are still cut back to stubs. We are pushing for a formal ban and a switch to structural pruning by trained arborists."
    hy:
      title: "Գագաթատում և կոպիտ էտ"
      description: "Քաղաքում ծառերը դեռ կտրվում են կոճղերի։ Մենք պահանջում ենք պաշտոնական արգելք և անցում վերապատրաստված արբորիստների կողմից կատարվող կառուցվածքային էտի։"

- link: "@/status/code/index.md"
  content:
    ru:
      title: "Нет стандарта ухода за деревьями"
      description: "В Ереване нет обязательных норм посадки и обрезки: решения зависят от мнения одного чиновника. Мы адаптируем европейские стандарты и ANSI A300 к местным условиям."
    en:
      title: "No modern care standards"
      description: "Yerevan has no binding standard for planting and pruning; decisions rest on one official's opinion. We are adapting European and ANSI A300 practice to local conditions."
    hy:
      title: "Խնամքի ժամանակակից չափորոշիչների բացակայություն"
      description: "Երևանում տնկման և էտի պարտադիր չափորոշիչ չկա։ Որոշումները կախված են մեկ պաշտոնյայի կարծիքից։ Մենք հարմարեցնում ենք եվրոպական և ANSI A300 պրակտիկան տեղական պայմաններին։"

- link: "@/status/invasive/index.md"
  content:
    ru:
      title: "Инвазивные виды"
      description: "Айлант захватывает пустыри и трещины в асфальте. Новые посадки прекращены, но программы удаления взрослых деревьев и их замены до сих пор нет."
    en:
      title: "Invasive species"
      description: "Ailanthus keeps colonizing vacant land and asphalt cracks. New plantings have stopped, but there is still no program to remove mature trees and replace them."
    hy:
      title: "Ինվազիվ տեսակներ"
      description: "Այլանտը զավթում է անխնամ տարածքներն ու ասֆալտի ճեղքերը։ Նոր տնկումները դադարեցվել են, սակայն հասուն ծառերի հեռացման և փոխարինման ծրագիր դեռ չկա։"

- link: "@/status/lawns/index.md"
  content:
    ru:
      title: "Голая земля и стриженые газоны"
      description: "Большая часть общественных территорий — голая пыльная земля, а коммунальщики по-прежнему выпалывают дикие травы, которые её удерживают. Смешанные луговые газоны — проверенная альтернатива."
    en:
      title: "Bare soil and close-cropped turf"
      description: "Most public land is bare, dusty soil — and crews still weed out the wild grass that holds it. Mixed meadow lawns are the proven alternative."
    hy:
      title: "Մերկ հող և միատեսակ սիզամարգեր"
      description: "Հանրային տարածքների մեծ մասը մերկ, փոշոտ հող է, իսկ աշխատակիցները դեռ պոկում են այն պահող վայրի խոտը։ Խառը մարգագետնային սիզամարգերը ապացուցված այլընտրանքն են։"

- link: "@/status/valuation/index.md"
  content:
    ru:
      title: "Мизерные штрафы за деревья"
      description: "Ущерб взрослому дереву стоит дешевле дров, поэтому корни обрубают, а стволы калечат без последствий. Штрафы должны покрывать полную стоимость замены."
    en:
      title: "Token fines for tree damage"
      description: "Damaging a mature tree costs less than firewood, so roots are severed and trunks scarred without consequence. Fines must reflect the full cost of replacement."
    hy:
      title: "Ծառերին հասցված վնասի խորհրդանշական տուգանքներ"
      description: "Հասուն ծառին վնասելն ավելի էժան է, քան վառելափայտը, ուստի արմատներն ու բունը վնասվում են առանց հետևանքների։ Տուգանքները պետք է արտացոլեն փոխարինման ամբողջական արժեքը։"

- link: "@/status/instrumental/index.md"
  content:
    ru:
      title: "Снос без доказательств"
      description: "Деревья сносят по визуальной оценке, без инструментальных данных и публичного уведомления. Мы готовим закон, который потребует инструментальных доказательств и 30 дней на обжалование."
    en:
      title: "Removals without evidence"
      description: "Trees are felled on visual guesses, with no diagnostic data and no public notice. We are drafting a law that requires instrumental proof and a 30-day appeal window."
    hy:
      title: "Հատումներ առանց ապացույցների"
      description: "Ծառերը հատվում են աչքի գնահատականով՝ առանց գործիքային տվյալների և հրապարակային ծանուցման։ Մենք մշակում ենք օրենք, որը կպահանջի գործիքային ապացույցներ և բողոքարկման 30-օրյա ժամկետ։"

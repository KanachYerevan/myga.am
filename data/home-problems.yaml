# "Problems" block on the home page.
#
# One item per card, in the order given here.
# "link" is a Zola internal path (@/...), so get_url resolves the translation
# for the active language and one entry serves all three languages.
# "content" holds the card title and teaser, which are editorial copy and are
# deliberately shorter than each page's own text.
#
# The heading ("title"), the optional intro and the items are all here, so the
# block owns everything it renders; the position on the page is set in
# templates/home.html. "intro" is one short paragraph above the list, rendered
# only when present; it is plain text, so it cannot contain Markdown links.

title:
  en: "Could Yerevan be greener?"
  ru: "Может ли Ереван стать зеленее?"
  hy: "Կարո՞ղ է Երևանն ավելի կանաչ լինել։"

intro:
  en: "We have analysed the situation and identified the core problems that prevent Yerevan from becoming the greenest city in the region. Read about these problems, how they are dealt with worldwide, and what Yerevan can do to solve them."
  ru: "Мы проанализировали ситуацию и выделили главные проблемы, которые мешают Еревану стать самым зелёным городом региона. Читайте об этих проблемах, о том, как их решают в мире, и о том, что Ереван может сделать, чтобы их преодолеть."
  hy: "Մենք վերլուծել ենք իրավիճակը և առանձնացրել ենք հիմնական խնդիրները, որոնք խանգարում են Երևանին դառնալ տարածաշրջանի ամենականաչ քաղաքը։ Կարդացեք այս խնդիրների մասին, թե ինչպես են դրանք լուծում աշխարհում, և թե ինչ կարող է անել Երևանը դրանք լուծելու համար։"

items:
  - link: "@/journal/2026-11-09-green-space-requirement/index.md"
    content:
      en:
        title: "Canopy coverage"
        description: "Tree canopy is thin over most of Yerevan, and only about 13% of the city lies within a short walk of a public park, far short of what the WHO recommends. The city needs a wider network of small, accessible green spaces in every district, not a handful of large destinations."
      ru:
        title: "Покрытие кронами"
        description: "Кроны деревьев покрывают лишь малую часть Еревана, а в пределах 300 метров от общественного парка находится лишь около 13% территории города — это далеко от рекомендаций ВОЗ. Городу нужна широкая сеть небольших доступных зелёных пространств в каждом районе, а не несколько крупных объектов."
      hy:
        title: "Սաղարթի ծածկույթ"
        description: "Երևանի մեծ մասում ծառերի սաղարթը նոսր է, և քաղաքի տարածքի ընդամենը մոտ 13%-ն է գտնվում հանրային այգուց 300 մետրի սահմաններում, ինչը հեռու է ԱՀԿ առաջարկներից։ Քաղաքին պետք է փոքր, հասանելի կանաչ տարածքների լայն ցանց յուրաքանչյուր շրջանում, այլ ոչ թե մի քանի խոշոր օբյեկտ։"

  - link: "@/status/code/index.md"
    content:
      en:
        title: "Management standards"
        description: "Pruning and planting quality are a disaster, soil is left unmanaged, the management personnel are mostly unqualified, and written standards do not exist. Established international tree care codes should be adopted."
      ru:
        title: "Стандарты ухода"
        description: "Качество обрезки и посадки катастрофическое, почвой никто не занимается, персонал зелёного хозяйства в большинстве своём не имеет квалификации, а письменных норм не существует. Пора принять действующие международные кодексы ухода за деревьями."
      hy:
        title: "Խնամքի չափորոշիչներ"
        description: "Էտի և տնկման որակը աղետալի է, հողով ոչ ոք չի զբաղվում, կանաչ տնտեսության աշխատակազմի մեծ մասը որակավորում չունի, իսկ գրավոր չափորոշիչներ չկան։ Պետք է ընդունել ծառերի խնամքի գործող միջազգային կանոնագրերը։"

  - link: "@/status/council/index.md"
    content:
      en:
        title: "Transparency"
        description: "Felling and larger projects happen overnight as a surprise, and the standards behind them stay hidden. The public is not involved in decision making, although it should be; the process must be made transparent and open."
      ru:
        title: "Прозрачность"
        description: "Снос деревьев и крупные проекты случаются внезапно, за одну ночь, а нормы, на которых они основаны, скрыты. Общественность не участвует в принятии решений, хотя должна; процесс нужно сделать прозрачным и открытым."
      hy:
        title: "Թափանցիկություն"
        description: "Ծառերի հատումն ու խոշոր նախագծերը տեղի են ունենում հանկարծակի՝ մեկ գիշերվա ընթացքում, իսկ դրանց հիմքում ընկած չափորոշիչները թաքցված են։ Հասարակությունը ներգրավված չէ որոշումների կայացմանը, թեև պետք է լինի։ Գործընթացը պետք է դարձնել թափանցիկ և բաց։"

  - link: "@/status/participation/index.md"
    content:
      en:
        title: "Resident involvement"
        description: "Planting a street tree is technically possible, but the procedure is obscure. Green space is run as an informal monopoly. There should be clear instructions on what residents may do without the city's approval."
      ru:
        title: "Участие жителей"
        description: "Посадить дерево на улице технически можно, но процедура непонятна. Зелёным хозяйством управляют как неформальной монополией. Должна быть понятная инструкция о том, что жители могут делать без разрешения города."
      hy:
        title: "Բնակիչների ներգրավվածություն"
        description: "Փողոցում ծառ տնկելը տեխնիկապես հնարավոր է, բայց ընթացակարգը մշուշոտ է։ Կանաչ տարածքները կառավարվում են որպես ոչ պաշտոնական մենաշնորհ։ Պետք է լինի հստակ ուղեցույց, թե ինչ կարող են բնակիչները անել առանց քաղաքի թույլտվության։"

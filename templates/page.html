{% extends "index.html" %}
{% import "macros.html" as macros %}

{% block title %}{{ page.title }} — {{ config.title }}{% endblock %}

{% block content %}
    <div class="post">
        <h1 class="post-title">{{ page.title }}</h1>

        <div class="meta">
            {% if page.date %}
                <span class="post-date">{{ page.date | date(format="%d.%m.%Y") }}</span>
            {% endif %}

            <div class="sep"></div>
        </div>

        {{ page.content | safe }}
    </div>
{% endblock content %}

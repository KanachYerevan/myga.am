{% set tiles = load_data(path="data/report.yaml") %}

{% if tiles | length > 0 %}
    <div class="campaign cards">
        {% for tile in tiles %}
            {% set permalink = get_url(path=tile.link, lang=lang) %}

            <div class="card">
                <a href="{{ permalink }}" class="image">
                    <img src="{{ tile.image }}" />
                </a>
                <div class="body">
                    <div class="title"><a href="{{ permalink }}">{{ tile.content[lang].title }}</a></div>
                    <div class="description">{{ tile.content[lang].description }}</div>
                </div>
            </div>
        {% endfor %}
    </div>
{% endif %}
